[project]
name = "policyproxy"
version = "0.1.0"
description = "Tiered runtime policy enforcement for AI agent tool calls"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policyproxy*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
